{% extends 'base.html' %}
<!-- 부트스트랩 라이브러리처럼 히용 load -->
{% load bootstrap4 %}

{% block content %}
<div style="text-align: center;">
    <h3> Login View </h3>
    <div style="text-align: center; width:20rem; margin: 2rem auto">
        <!-- <p>이곳에 로그인 form이 있어야 합니다.</p> -->
        <!-- {{ form }} -->

        <!-- action url 로 form의 input 값 날라감 -->
        <form action="" method="post">
            {% csrf_token %}

            {% bootstrap_form form %}
            <input type="submit" class="btn btn-warning mt-3">
        </form>
    </div>
</div>
{% endblock %}
